[package]
name = "gsk"
version = "0.1.0"
edition = "2024"
description = "Independent GSK CNC UDP file transfer client"
license = "MIT"
repository = "https://github.com/drockso/gsk-rust"
readme = "README.md"
keywords = ["cnc", "gsk", "udp", "file-transfer", "cli"]
categories = ["command-line-utilities", "network-programming"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3"
sha2 = "0.10"
tempfile = "3"
