name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: target/release/gsk.exe
          - os: ubuntu-latest
            binary: target/release/gsk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Rust
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.94.1 fmt --check
      - run: cargo +1.94.1 clippy --all-targets --locked -- -D warnings
      - run: cargo +1.94.1 test --locked
      - run: cargo +1.94.1 build --release --locked
      - name: CLI integration (loopback only)
        run: python -X utf8 tests/integration.py ${{ matrix.binary }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gsk-${{ matrix.os }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  musl:
    name: Static Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: |
          rustup toolchain install 1.94.1 --profile minimal --target x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - run: cargo +1.94.1 build --release --locked --target x86_64-unknown-linux-musl
      - run: python3 tests/integration.py target/x86_64-unknown-linux-musl/release/gsk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gsk-linux-x64-musl
          path: target/x86_64-unknown-linux-musl/release/gsk
          if-no-files-found: error
